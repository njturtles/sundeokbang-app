name: sundeokbang
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0-203.0.dev <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0
  webview_flutter_android: ^4.0.0 # Kakao SDK와 호환되는 버전 추가
  jwt_decoder: ^2.0.1
  kakao_flutter_sdk: ^1.9.6
  kakao_flutter_sdk_user: ^1.9.6
  http: ^0.13.5
  cupertino_icons: ^1.0.8
  dropdown_button2: ^2.3.9
  url_launcher: ^6.2.4
  flutter_dotenv: ^5.1.0
  intl: ^0.17.0
  flutter_inappwebview: ^6.0.0
  dio: ^5.4.3+1
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  webview_flutter: ^4.9.0 # 강제로 특정 버전 사용
  webview_flutter_android: ^3.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900
